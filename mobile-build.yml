name: Mobile EAS Build

# Requires an EXPO_TOKEN secret (from `eas login` / expo.dev access tokens)
# set in this repo's Settings > Secrets and variables > Actions.
# See docs/DEPLOYMENT.md for full setup.

on:
  push:
    tags:
      - 'rider-v*'
      - 'mechanic-v*'
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to build'
        required: true
        type: choice
        options: [rider, mechanic]
      profile:
        description: 'EAS build profile'
        required: true
        default: preview
        type: choice
        options: [development, preview, production]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Determine app + profile
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "app=${{ inputs.app }}" >> "$GITHUB_OUTPUT"
            echo "profile=${{ inputs.profile }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_name }}" == rider-v* ]]; then
            echo "app=rider" >> "$GITHUB_OUTPUT"
            echo "profile=production" >> "$GITHUB_OUTPUT"
          else
            echo "app=mechanic" >> "$GITHUB_OUTPUT"
            echo "profile=production" >> "$GITHUB_OUTPUT"
          fi

      - name: EAS Build
        working-directory: apps/mobile-${{ steps.params.outputs.app }}
        run: eas build --platform all --profile ${{ steps.params.outputs.profile }} --non-interactive --no-wait
