version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: velo-postgres
    environment:
      POSTGRES_USER: velo
      POSTGRES_PASSWORD: velo
      POSTGRES_DB: velo_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - velo-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U velo']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: velo-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - velo-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: velo-meilisearch
    environment:
      MEILI_MASTER_KEY: masterKey
    ports:
      - '7700:7700'
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - velo-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7700/health']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:

networks:
  velo-network:
    driver: bridge
