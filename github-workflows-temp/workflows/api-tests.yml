name: API tests

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - '.github/workflows/api-tests.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: velo
          POSTGRES_PASSWORD: velo
          POSTGRES_DB: velo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U velo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: velo
      DB_PASSWORD: velo
      DB_NAME: velo_test
      DB_NAME_TEST: velo_test
      JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit
        working-directory: apps/api

      - name: Lint
        run: npm run lint
        working-directory: apps/api
        continue-on-error: true # pre-existing lint debt; not blocking CI yet

      - name: Run migrations against the test database
        run: npm run migrate
        working-directory: apps/api

      - name: Run tests
        run: npm test
        working-directory: apps/api

      - name: Production build (catches broken path aliases / TS strictness issues tsx doesn't check)
        run: npm run build
        working-directory: apps/api
